name: Build Android APK

on:
  workflow_dispatch:

  push:
    paths:
      - "android/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare ConnectBot termlib
        run: |
          rm -rf vendor/termlib

          git clone https://github.com/connectbot/termlib.git vendor/termlib

          git -C vendor/termlib checkout \
            735c6dc646a845099f34083a15bd295be145a6ce

          echo "termlib commit:"
          git -C vendor/termlib rev-parse HEAD

          # Fix upstream FocusRequester crash.
          # imeFocusRequester is never attached to the hidden AndroidView;
          # focusRequester is.
          python3 - <<'PY'
          from pathlib import Path

          p = Path("vendor/termlib/lib/src/main/java/org/connectbot/terminal/Terminal.kt")
          s = p.read_text()

          old = "imeFocusRequester.requestFocus()"
          new = "focusRequester.requestFocus()"

          assert old in s, "FocusRequester target not found"
          p.write_text(s.replace(old, new, 1))

          print("Patched termlib FocusRequester crash")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmake;3.22.1"

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Show APK
        run: |
          find android/app/build/outputs/apk -type f -name "*.apk" -print
          ls -lh android/app/build/outputs/apk/debug/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pr-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
