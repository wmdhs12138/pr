[package]
name = "proot-integration-test"
version = "0.1.0"
edition = "2021"
description = "Integration tests for proot behavior inside Linux distros"

[dependencies]
libc = { version = "0.2", optional = true }

[features]
default = []
full-deps = ["libc"]

[profile.release]
opt-level = "z"
lto = true
strip = true
